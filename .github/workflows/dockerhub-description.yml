name: Docker Hub description

on:
  push:
    branches: ["main"]
    paths:
      - "packaging/docker/overview.md"
      - ".github/workflows/dockerhub-description.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A separate token from the one that pushes images: editing repository
      # metadata needs the delete-level scope, and a push token does not.
      - env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        run: |
          set -euo pipefail

          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_DESCRIPTION_TOKEN" \
                  '{username: $u, password: $p}' \
                | curl -sS -H 'Content-Type: application/json' -d @- \
                    https://hub.docker.com/v2/users/login/ \
                | jq -r '.token // empty')
          [ -n "$jwt" ] || { echo "docker hub login failed"; exit 1; }

          code=$(jq -n --rawfile d packaging/docker/overview.md '{full_description: $d}' \
                 | curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH -d @- \
                     -H "Authorization: JWT $jwt" \
                     -H 'Content-Type: application/json' \
                     "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/nvme-logpage-exporter/")

          case "$code" in
            2*) echo "description synced" ;;
            *)  echo "HTTP $code"
                cat /tmp/resp.json
                # base64url, and GNU base64 rejects it without translation and padding.
                p=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
                case $(( ${#p} % 4 )) in 2) p="$p==" ;; 3) p="$p=" ;; esac
                echo "token scope: $(printf '%s' "$p" | base64 -d 2>/dev/null \
                                     | jq -r '.scope // "unknown"' 2>/dev/null || echo unknown)"
                echo "editing the description needs a token with read, write and delete"
                exit 1 ;;
          esac

          echo "description synced"
