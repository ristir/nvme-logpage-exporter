---
apiVersion: v1
kind: Namespace
metadata:
  name: nvme-logpage-exporter
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvme-logpage-exporter
  namespace: nvme-logpage-exporter
  labels:
    app.kubernetes.io/name: nvme-logpage-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvme-logpage-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvme-logpage-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10192"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvme
                    operator: In
                    values: ["true"]
      tolerations:
        - operator: Exists
      containers:
        - name: exporter
          image: ghcr.io/ristir/nvme-logpage-exporter:latest
          args:
            - --web.listen-address=:10192
          ports:
            - name: metrics
              containerPort: 10192
          securityContext:
            # Kubernetes has no field for a device cgroup rule, so a hostPath
            # /dev without this gets EPERM on open. A device plugin writes one.
            privileged: true
            # A capability reaches the effective set for uid 0 alone.
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: 10192
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
